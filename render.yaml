# Render Blueprint — deploys the app as a free public web service.
# Uses the repo Dockerfile (deterministic build) rather than Render's Python
# autodetection. Connect this repo at https://dashboard.render.com -> New ->
# Blueprint, or use the one-click "Deploy to Render" button in the README.
services:
  - type: web
    name: medical-coding-billing
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: EPIC_MOCK_MODE
        value: "true"
